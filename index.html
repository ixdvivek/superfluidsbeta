<!DOCTYPE html>

<title>Superfluids — Pumping Systems, Water Storage &amp; Fluid Engineering Across the GCC</title>

<!-- Figma icon set. Tab icons are the teal variant on transparent: it is
     the only one legible on both light and dark browser chrome — navy
     disappears into a dark tab strip (1.0:1) and white into a light one
     (1.0:1), while teal holds at 1.7:1 light and 7.4:1 dark. Low for text,
     but this is a solid outlined shape, not a glyph stroke.

     The Apple icon keeps a navy ground: iOS composites the home-screen
     icon onto black, so transparency there would lose the mark.

     32px is listed as well as 64 — browsers pick the nearest declared size
     and downscaling 64 to a 16px tab closes up the ligature. -->
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png" />
<link rel="icon" type="image/png" sizes="64x64" href="assets/icons/favicon-64.png" />
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png" />
<meta name="theme-color" content="#0E2341" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="_ds/superfluids-design-system-e3893dc0-b4a9-42cd-8295-115c35d8d15b/styles.css" />
<!-- Token overlay: type, tracking, radius, rhythm -->
<link rel="stylesheet" href="site/theme.css" />
<!-- Tailwind (compiled: npx tailwindcss -i site/tailwind.src.css -o site/tailwind.css --minify) -->

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@1.30.0/dist/umd/lucide.min.js" integrity="sha384-Lehp/dEjQw2+58R4nCzfMqOECBJX6eElVUQwfl5Zu2ASFb94h94sxAx5NHZj4VTR" crossorigin="anonymous"></script>
<script src="_ds/superfluids-design-system-e3893dc0-b4a9-42cd-8295-115c35d8d15b/_ds_bundle.js"></script>

<style>
  #app { height: 100vh; overflow-y: auto; overflow-x: hidden; }
</style>
</head>
<body>

<!-- Boot screen. Deliberately inline HTML and CSS, not a React component:
     React and Babel take ~1.3s on desktop and several seconds on a phone to
     compile the JSX, and a React loader could not appear until that work was
     already done — which is the exact window this covers. Painted on the first
     frame, removed once the app mounts. -->
<style>
  #boot {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    background: #000A33;
    transition: opacity 420ms cubic-bezier(0, 0, 0.58, 1);
  }
  #boot.is-done { opacity: 0; pointer-events: none; }
  #boot .mark { position: relative; width: 104px; height: 104px;
                display: flex; align-items: center; justify-content: center; }
  /* The icon's canvas is 50x50 but the droplet is narrow and fills the
     height, so size by height — at width:34px the visible mark was ~12px. */
  #boot img { height: 58px; width: auto; display: block; }
  #boot svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #boot circle {
    fill: none; stroke: #3ABDC4; stroke-width: 2.5; stroke-linecap: round;
    /* r=46 -> circumference 289. A 70/289 arc leaves a clear gap. */
    stroke-dasharray: 70 219;
    transform-origin: 50% 50%;
    animation: boot-spin 1150ms linear infinite;
  }
  @keyframes boot-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    #boot circle { animation: none; stroke-dasharray: 289; opacity: 0.32; }
  }
</style>
<div id="boot">
  <div class="mark">
    <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" /></svg>
    <img src="assets/logos/superfluids-icon-teal.svg" alt="Superfluids — loading" />
  </div>
</div>

<!-- Route wash. Same navy, so a page change reads as the same surface
     closing and reopening rather than a white flash between two dark pages. -->
<div id="wash" aria-hidden="true"></div>

<div id="app" data-scroll></div>

<!-- Data (plain JS) -->
<script src="site/products.js"></script>
<script src="site/data.js"></script>
<script src="site/brandlogos.js"></script>

<!-- Components (JSX) -->
<script type="text/babel" src="site/Kit.jsx"></script>
<script type="text/babel" src="site/Chrome.jsx"></script>
<script type="text/babel" src="site/Home.jsx"></script>
<script type="text/babel" src="site/Products.jsx"></script>
<script type="text/babel" src="site/ProductDetail.jsx"></script>
<script type="text/babel" src="site/Services.jsx"></script>
<script type="text/babel" src="site/ServiceDetail.jsx"></script>
<script type="text/babel" src="site/Projects.jsx"></script>
<script type="text/babel" src="site/ProjectDetail.jsx"></script>
<script type="text/babel" src="site/About.jsx"></script>
<script type="text/babel" src="site/Industries.jsx"></script>
<script type="text/babel" src="site/Brands.jsx"></script>
<script type="text/babel" src="site/Contact.jsx"></script>

<script type="text/babel" data-presets="react">
  // Note: `type="text/babel"` scripts share one global scope, so nothing
  // here may reuse a top-level identifier from Kit.jsx (Section, Button…).
  // Kit members are read off window.SFKit inside each component instead.

  // ---- routing ------------------------------------------------
  // Hash-based so the static host needs no rewrite rules. Paths are
  // written to convert directly to real routes at the Next.js move.

  const ROUTE_PATHS = {
    Home: "",
    About: "about",
    Products: "products",
    Services: "services",
    Industries: "industries",
    Projects: "projects",
    Brands: "brands",
    Contact: "contact",
  };
  const DETAIL_PREFIX = {
    ProductDetail: "products",
    ServiceDetail: "services",
    ProjectDetail: "projects",
  };

  function routeToHash(route) {
    const name = typeof route === "string" ? route : route.name;
    const param = typeof route === "string" ? null : route.param;
    if (DETAIL_PREFIX[name] && param) return "#/" + DETAIL_PREFIX[name] + "/" + param;
    return "#/" + (ROUTE_PATHS[name] || "");
  }

  function hashToRoute(hash) {
    const parts = (hash || "").replace(/^#\/?/, "").split("/").filter(Boolean);
    if (!parts.length) return "Home";
    const [head, slug] = parts;
    if (slug) {
      const name = Object.keys(DETAIL_PREFIX).find((k) => DETAIL_PREFIX[k] === head);
      if (name) return { name, param: slug };
    }
    const name = Object.keys(ROUTE_PATHS).find((k) => ROUTE_PATHS[k] === head);
    return name || "Home";
  }

  // ---- page metadata ------------------------------------------

  const TITLES = {
    Home: "Superfluids — Pumping Systems, Water Storage & Fluid Engineering Across the GCC",
    About: "About Superfluids — Engineering Fluid Solutions for Industrial Excellence",
    Products: "Products & Services — Complete Fluid Engineering Solutions",
    Services: "Services — Total MEP & Fluid Engineering",
    Industries: "Industries We Serve — Superfluids",
    Projects: "Projects — 2,500+ Delivered Across the GCC",
    Brands: "Our Brands & Partners — Superfluids",
    Contact: "Contact — Let's Engineer Your Next Project",
  };

  const STUB_LABELS = {
    Industries: "Industries We Serve",
    Projects: "Projects",
    ProjectDetail: "Project Case Study",
    Brands: "Our Brands & Partners",
    Contact: "Contact",
    About: "About Superfluids",
  };

  // Detail routes highlight their parent nav item.
  const PARENT = {
    ProductDetail: "Products",
    ServiceDetail: "Services",
    ProjectDetail: "Projects",
    Brands: "About",
  };

  // Placeholder for routes not yet rebuilt in the new design language.
  function Stub({ name, onNavigate }) {
    const { Section, Container, Button, Eyebrow } = window.SFKit;
    return (
      <Section tone="light">
        <Container width="var(--container-text)">
          <div className="flex flex-col items-start gap-5 py-24">
            <Eyebrow>In progress</Eyebrow>
            <h1 className="sf-h1">{name}</h1>
            <p className="sf-body-lg">
              This page is next in the rebuild. Foundation, component kit, Home,
              and the product and service templates are complete.
            </p>
            <Button variant="primary" icon="arrow-left" onClick={() => onNavigate("Home")}>
              Back to Home
            </Button>
          </div>
        </Container>
      </Section>
    );
  }

  function App() {
    const [route, setRoute] = React.useState(() => hashToRoute(window.location.hash));

    // Browser back/forward and direct links.
    React.useEffect(() => {
      const onHash = () => {
        setRoute(hashToRoute(window.location.hash));
        const el = document.getElementById("app");
        if (el) el.scrollTo({ top: 0, behavior: "auto" });
      };
      window.addEventListener("hashchange", onHash);
      return () => window.removeEventListener("hashchange", onHash);
    }, []);

    // Wash over the swap. The route change itself is instant; what needs
    // covering is the scroll reset, which is otherwise an abrupt jump.
    const navigate = React.useCallback((r) => {
      const next = routeToHash(r);
      const same = window.location.hash === next;
      const wash = document.getElementById("wash");
      const reduced = window.matchMedia &&
        window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      const swap = () => {
        if (same) {
          const el = document.getElementById("app");
          if (el) el.scrollTo({ top: 0, behavior: "auto" });
        } else {
          window.location.hash = next;
        }
      };

      if (!wash || reduced) { swap(); return; }

      // Cover, hold, swap, uncover. The hold matters: releasing on the next
      // frame let the fade-out begin before the cover was complete, so the
      // scroll reset showed through at ~0.6 opacity.
      wash.classList.add("is-on");
      window.setTimeout(() => {
        swap();
        window.setTimeout(() => wash.classList.remove("is-on"), 90);
      }, 175);
    }, []);

    const name = typeof route === "string" ? route : route.name;
    const param = typeof route === "string" ? null : route.param;

    React.useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

    // Keep the document title in step with the route, for tabs and sharing.
    React.useEffect(() => {
      const D = window.SFData;
      let t = TITLES[name];
      if (name === "ProductDetail") {
        const p = (D.products || []).find((x) => x.slug === param);
        t = p ? p.name + " — Superfluids" : "Product — Superfluids";
      } else if (name === "ServiceDetail") {
        const s = (D.services || []).find((x) => x.slug === param);
        t = s ? s.name + " — Superfluids" : "Services — Superfluids";
      } else if (name === "ProjectDetail") {
        const p = (D.projects || []).find((x) => x.slug === param);
        t = p ? p.name + " — Superfluids" : "Project — Superfluids";
      }
      if (t) document.title = t;
    }, [name, param]);

    const SCREENS = {
      Home: window.SF_HomeScreen,
      Products: window.SF_ProductsScreen,
      ProductDetail: window.SF_ProductDetailScreen,
      Services: window.SF_ServicesScreen,
      ServiceDetail: window.SF_ServiceDetailScreen,
      Projects: window.SF_ProjectsScreen,
      ProjectDetail: window.SF_ProjectDetailScreen,
      About: window.SF_AboutScreen,
      Industries: window.SF_IndustriesScreen,
      Brands: window.SF_BrandsScreen,
      Contact: window.SF_ContactScreen,
    };

    const Screen = SCREENS[name];
    const Header = window.SF_Header, Footer = window.SF_Footer;

    return (
      <React.Fragment>
        <Header active={PARENT[name] || name} onNavigate={navigate} />
        {Screen
          ? <Screen onNavigate={navigate} param={param} />
          : <Stub name={STUB_LABELS[name] || name} onNavigate={navigate} />}
        <Footer onNavigate={navigate} />
      </React.Fragment>
    );
  }

  ReactDOM.createRoot(document.getElementById("app")).render(<App />);

  // Hold the boot screen until the app has actually painted, then fade it.
  // Two frames: the first commits React's DOM, the second lets it paint.
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const boot = document.getElementById("boot");
    if (!boot) return;
    boot.classList.add("is-done");
    boot.addEventListener("transitionend", () => boot.remove(), { once: true });
    // Fallback: transitionend never fires under reduced motion.
    setTimeout(() => boot.remove(), 700);
  }));
</script>
</body>
</html>
