<!DOCTYPE html>
<html lang="en">
<head>

     aspect as a tab icon, so square derivatives are used here. -->

<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png" />
<meta name="theme-color" content="#0E2341" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap">

<!-- Design system tokens (colors, shadows, gradients) -->
<link rel="stylesheet" href="_ds/superfluids-design-system-e3893dc0-b4a9-42cd-8295-115c35d8d15b/styles.css" />
<!-- Token overlay: type, tracking, radius, rhythm -->
<link rel="stylesheet" href="site/theme.css" />
<!-- Tailwind (compiled: npx tailwindcss -i site/tailwind.src.css -o site/tailwind.css --minify) -->
<link rel="stylesheet" href="site/tailwind.css" />

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@1.30.0/dist/umd/lucide.min.js" integrity="sha384-Lehp/dEjQw2+58R4nCzfMqOECBJX6eElVUQwfl5Zu2ASFb94h94sxAx5NHZj4VTR" crossorigin="anonymous"></script>
<script src="_ds/superfluids-design-system-e3893dc0-b4a9-42cd-8295-115c35d8d15b/_ds_bundle.js"></script>

<style>
  #app { height: 100vh; overflow-y: auto; overflow-x: hidden; }
</style>
</head>
<body>
<div id="app" data-scroll></div>

<!-- Data (plain JS) -->
<script src="site/products.js"></script>
<script src="site/data.js"></script>

<!-- Components (JSX) -->
<script type="text/babel" src="site/Kit.jsx"></script>
<script type="text/babel" src="site/Chrome.jsx"></script>
<script type="text/babel" src="site/Home.jsx"></script>
<script type="text/babel" src="site/Products.jsx"></script>
<script type="text/babel" src="site/ProductDetail.jsx"></script>
<script type="text/babel" src="site/Services.jsx"></script>
<script type="text/babel" src="site/ServiceDetail.jsx"></script>

<script type="text/babel" data-presets="react">
  // Note: `type="text/babel"` scripts share one global scope, so nothing
  // here may reuse a top-level identifier from Kit.jsx (Section, Button…).
  // Kit members are read off window.SFKit inside each component instead.

  // ---- routing ------------------------------------------------
  // Hash-based so the static host needs no rewrite rules. Paths are
  // written to convert directly to real routes at the Next.js move.

  const ROUTE_PATHS = {
    Home: "",
    About: "about",
    Products: "products",
    Services: "services",
    Industries: "industries",
    Projects: "projects",
    Brands: "brands",
    Contact: "contact",
  };
  const DETAIL_PREFIX = {
    ProductDetail: "products",
    ServiceDetail: "services",
    ProjectDetail: "projects",
  };

  function routeToHash(route) {
    const name = typeof route === "string" ? route : route.name;
    const param = typeof route === "string" ? null : route.param;
    if (DETAIL_PREFIX[name] && param) return "#/" + DETAIL_PREFIX[name] + "/" + param;
    return "#/" + (ROUTE_PATHS[name] || "");
  }

  function hashToRoute(hash) {
    const parts = (hash || "").replace(/^#\/?/, "").split("/").filter(Boolean);
    if (!parts.length) return "Home";
    const [head, slug] = parts;
    if (slug) {
      const name = Object.keys(DETAIL_PREFIX).find((k) => DETAIL_PREFIX[k] === head);
      if (name) return { name, param: slug };
    }
    const name = Object.keys(ROUTE_PATHS).find((k) => ROUTE_PATHS[k] === head);
    return name || "Home";
  }

  // ---- page metadata ------------------------------------------

  const TITLES = {
    Home: "Superfluids — Pumping Systems, Water Storage & Fluid Engineering Across the GCC",
    About: "About Superfluids — Engineering Fluid Solutions for Industrial Excellence",
    Products: "Products & Services — Complete Fluid Engineering Solutions",
    Services: "Services — Total MEP & Fluid Engineering",
    Industries: "Industries We Serve — Superfluids",
    Projects: "Projects — 2,500+ Delivered Across the GCC",
    Brands: "Our Brands & Partners — Superfluids",
    Contact: "Contact — Let's Engineer Your Next Project",
  };

  const STUB_LABELS = {
    Industries: "Industries We Serve",
    Projects: "Projects",
    ProjectDetail: "Project Case Study",
    Brands: "Our Brands & Partners",
    Contact: "Contact",
    About: "About Superfluids",
  };

  // Detail routes highlight their parent nav item.
  const PARENT = {
    ProductDetail: "Products",
    ServiceDetail: "Services",
    ProjectDetail: "Projects",
    Brands: "About",
  };

  // Placeholder for routes not yet rebuilt in the new design language.
  function Stub({ name, onNavigate }) {
    const { Section, Container, Button, Eyebrow } = window.SFKit;
    return (
      <Section tone="light">
        <Container width="var(--container-text)">
          <div className="flex flex-col items-start gap-5 py-24">
            <Eyebrow>In progress</Eyebrow>
            <h1 className="sf-h1">{name}</h1>
            <p className="sf-body-lg">
              This page is next in the rebuild. Foundation, component kit, Home,
              and the product and service templates are complete.
            </p>
            <Button variant="primary" icon="arrow-left" onClick={() => onNavigate("Home")}>
              Back to Home
            </Button>
          </div>
        </Container>
      </Section>
    );
  }

  function App() {
    const [route, setRoute] = React.useState(() => hashToRoute(window.location.hash));

    // Browser back/forward and direct links.
    React.useEffect(() => {
      const onHash = () => {
        setRoute(hashToRoute(window.location.hash));
        const el = document.getElementById("app");
        if (el) el.scrollTo({ top: 0, behavior: "auto" });
      };
      window.addEventListener("hashchange", onHash);
      return () => window.removeEventListener("hashchange", onHash);
    }, []);

    const navigate = React.useCallback((r) => {
      const next = routeToHash(r);
      if (window.location.hash === next) {
        const el = document.getElementById("app");
        if (el) el.scrollTo({ top: 0, behavior: "auto" });
      } else {
        window.location.hash = next;
      }
    }, []);

    const name = typeof route === "string" ? route : route.name;
    const param = typeof route === "string" ? null : route.param;

    React.useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

    // Keep the document title in step with the route, for tabs and sharing.
    React.useEffect(() => {
      const D = window.SFData;
      let t = TITLES[name];
      if (name === "ProductDetail") {
        const p = (D.products || []).find((x) => x.slug === param);
        t = p ? p.name + " — Superfluids" : "Product — Superfluids";
      } else if (name === "ServiceDetail") {
        const s = (D.services || []).find((x) => x.slug === param);
        t = s ? s.name + " — Superfluids" : "Services — Superfluids";
      } else if (name === "ProjectDetail") {
        const p = (D.projects || []).find((x) => x.slug === param);
        t = p ? p.name + " — Superfluids" : "Project — Superfluids";
      }
      if (t) document.title = t;
    }, [name, param]);

    const SCREENS = {
      Home: window.SF_HomeScreen,
      Products: window.SF_ProductsScreen,
      ProductDetail: window.SF_ProductDetailScreen,
      Services: window.SF_ServicesScreen,
      ServiceDetail: window.SF_ServiceDetailScreen,
    };

    const Screen = SCREENS[name];
    const Header = window.SF_Header, Footer = window.SF_Footer;

    return (
      <React.Fragment>
        <Header active={PARENT[name] || name} onNavigate={navigate} />
        {Screen
          ? <Screen onNavigate={navigate} param={param} />
          : <Stub name={STUB_LABELS[name] || name} onNavigate={navigate} />}
        <Footer onNavigate={navigate} />
      </React.Fragment>
    );
  }

  ReactDOM.createRoot(document.getElementById("app")).render(<App />);
</script>
</body>
</html>
